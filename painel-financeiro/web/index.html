<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOR&CO — Painel Financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0f; --s1:#111118; --s2:#16161f; --bd:#1e1e2e;
  --accent:#7C3AED; --amber:#f5a623; --green:#00c875; --blue:#4a90e2;
  --text:#e8e8f0; --muted:#5a5a7a; --dim:#1e1e2e;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;}
a,button{cursor:pointer;}

/* NAV */
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid var(--bd);background:var(--s1);position:sticky;top:0;z-index:100;}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-1px;}
.logo span{color:var(--accent);}
.nav-tabs{display:flex;gap:4px;}
.tab{padding:8px 18px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;background:none;border:1px solid var(--bd);color:var(--muted);transition:.2s;}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tab:hover:not(.active){border-color:var(--text);color:var(--text);}
.nav-right{display:flex;align-items:center;gap:12px;}
.mes-sel{display:flex;align-items:center;gap:8px;}
.mes-sel label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.mes-sel select{background:var(--s2);color:var(--amber);border:1px solid var(--amber);padding:6px 10px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;outline:none;}
.save-indicator{font-size:10px;color:var(--green);opacity:0;transition:.3s;}
.save-indicator.show{opacity:1;}

/* PAGES */
.page{display:none;padding:24px 28px;}
.page.active{display:block;}

/* GRID */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.g12{display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-bottom:14px;}

/* CARD */
.card{background:var(--s1);border:1px solid var(--bd);padding:20px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--bd);}
.card.ca::before{background:var(--accent);}
.card.cg::before{background:var(--green);}
.card.cb::before{background:var(--amber);}
.card.cbl::before{background:var(--blue);}
.clabel{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.cval{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;line-height:1;}
.csub{font-size:10px;color:var(--muted);margin-top:6px;}
.ctitle{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}

/* TABLE */
table{width:100%;border-collapse:collapse;}
th{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 0 10px;border-bottom:1px solid var(--bd);}
th:last-child{text-align:right;}
td{padding:10px 0;font-size:11px;border-bottom:1px solid var(--dim);vertical-align:middle;}
td:last-child{text-align:right;}
tr:last-child td{border-bottom:none;}

/* VALUES */
.vp{color:var(--green);font-family:'Syne',sans-serif;font-weight:600;}
.vn{color:var(--accent);font-family:'Syne',sans-serif;font-weight:600;}
.va{color:var(--amber);font-family:'Syne',sans-serif;font-weight:600;}

/* TAG */
.tag{display:inline-block;padding:2px 8px;font-size:9px;letter-spacing:1px;text-transform:uppercase;}
.tp{background:rgba(0,200,117,.12);color:var(--green);}
.ta{background:rgba(245,166,35,.12);color:var(--amber);}

/* FLOW */
.fr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--dim);font-size:11px;}
.fr:last-child{border-bottom:none;}
.ft{display:flex;justify-content:space-between;padding:12px 0 0;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;border-top:1px solid var(--accent);margin-top:4px;}

/* ALERT */
.ar{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--dim);}
.ar:last-child{border-bottom:none;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dr{background:var(--accent);box-shadow:0 0 6px var(--accent);}
.da{background:var(--amber);}
.dg{background:var(--green);}
.ai{flex:1;}
.ad{font-size:11px;margin-bottom:2px;}
.adate{font-size:9px;color:var(--muted);}

/* PROGRESS */
.pw{margin:12px 0 6px;}
.pl{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:5px;}
.pt{height:3px;background:var(--dim);border-radius:2px;overflow:hidden;}
.pf{height:100%;border-radius:2px;}

/* FORM */
.form-section{background:var(--s1);border:1px solid var(--bd);padding:24px;margin-bottom:16px;}
.form-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;color:var(--text);}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
.form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
.fgroup{display:flex;flex-direction:column;gap:6px;}
.fgroup label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.fgroup input,.fgroup select{background:var(--s2);border:1px solid var(--bd);color:var(--text);padding:9px 12px;font-family:'DM Mono',monospace;font-size:11px;outline:none;width:100%;transition:.2s;}
.fgroup input:focus,.fgroup select:focus{border-color:var(--accent);}
.fgroup select option{background:var(--s2);}
.btn{padding:10px 20px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;border:none;cursor:pointer;transition:.2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#c73350;}
.btn-secondary{background:transparent;border:1px solid var(--bd);color:var(--muted);}
.btn-secondary:hover{border-color:var(--text);color:var(--text);}
.btn-sm{padding:4px 10px;font-size:9px;}
.btn-del{background:transparent;border:1px solid rgba(233,69,96,.3);color:var(--accent);padding:3px 8px;font-size:9px;cursor:pointer;}
.btn-del:hover{background:rgba(233,69,96,.1);}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:4px;}

/* LIST TABLE */
.list-table td{font-size:11px;padding:8px 4px;}
.list-table th{padding:0 4px 8px;}
.list-table{margin-top:16px;}

/* VENC TABLE */
.vc-dia{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;}

/* SECTION HEADER */
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.sh h3{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}

/* ROTINA */
.rotina{background:linear-gradient(135deg,rgba(233,69,96,.06),rgba(74,144,226,.06));border:1px solid rgba(233,69,96,.3);padding:14px 16px;margin-top:14px;}
.rt{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.ri{display:flex;flex-wrap:wrap;gap:10px;}
.ri span{font-size:10px;color:var(--muted);}
.ri span::before{content:'→ ';color:var(--accent);}

/* EMPTY */
.empty{text-align:center;color:var(--muted);font-size:11px;padding:24px 0;}

/* EDIT highlight */
.editing{border-color:var(--amber) !important;}

  /* LOGIN */
  #login-screen {
    position:fixed;inset:0;background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    z-index:9999;
  }
  .login-box {
    background:var(--s1);border:1px solid var(--bd);
    padding:48px 40px;width:360px;text-align:center;
  }
  .login-logo {
    font-family:'Syne',sans-serif;font-size:28px;font-weight:800;
    letter-spacing:-1px;margin-bottom:8px;
  }
  .login-logo span{color:var(--accent);}
  .login-sub {
    font-size:10px;letter-spacing:3px;text-transform:uppercase;
    color:var(--muted);margin-bottom:36px;
  }
  .login-field {
    width:100%;background:var(--s2);border:1px solid var(--bd);
    color:var(--text);padding:12px 14px;font-family:'DM Mono',monospace;
    font-size:12px;outline:none;margin-bottom:12px;
    transition:.2s;box-sizing:border-box;
  }
  .login-field:focus{border-color:var(--accent);}
  .login-btn {
    width:100%;padding:12px;background:var(--accent);color:#fff;
    border:none;font-family:'DM Mono',monospace;font-size:11px;
    letter-spacing:2px;text-transform:uppercase;cursor:pointer;
    transition:.2s;margin-top:4px;
  }
  .login-btn:hover{opacity:.85;}
  .login-error {
    font-size:10px;color:var(--accent);margin-top:10px;
    min-height:16px;
  }

</style>
<style id="tema-claro">

<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">MOR<span>&</span>CO</div>
    <div class="login-sub">Painel Financeiro</div>
    <input class="login-field" type="password" id="login-pass" placeholder="Senha" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>


<!-- NAV -->
<nav class="nav">
  <div class="logo">MOR<span>&</span>CO</div>
  <div class="nav-tabs">
    <button class="tab active" onclick="showPage('dashboard')">Dashboard</button>
    <button class="tab" onclick="showPage('entradas')">Entradas</button>
    <button class="tab" onclick="showPage('custos')">Custos</button>
  </div>
  <div class="nav-right">
    <div class="mes-sel">
      <label>Mês</label>
      <select id="mes-sel" onchange="renderDashboard()">
        <option value="jan">Jan</option><option value="fev">Fev</option>
        <option value="mar">Mar</option><option value="abr" selected>Abr</option>
        <option value="mai">Mai</option><option value="jun">Jun</option>
        <option value="jul">Jul</option><option value="ago">Ago</option>
        <option value="set">Set</option><option value="out">Out</option>
        <option value="nov">Nov</option><option value="dez">Dez</option>
      </select>
    </div>
    <span class="save-indicator" id="save-ind">✓ Salvo</span>
  </div>
</nav>

<!-- DASHBOARD -->
<div class="page active" id="page-dashboard">
  <div class="g3" id="kpis"></div>
  <div style="margin-bottom:14px">
    <div class="card cg" id="entradas-dash"></div>
  </div>
  <div class="g2">
    <div class="card cb" id="custos-dash"></div>
    <div class="card cbl" id="resultado-dash"></div>
  </div>
  <div class="g2">
    <div class="card" id="venc-card"></div>
    <div class="card" id="pend-card"></div>
  </div>
</div>

<!-- ENTRADAS -->
<div class="page" id="page-entradas">
  <div class="form-section">
    <div class="form-title" id="entrada-form-title">Nova Entrada</div>
    <div class="form-grid">
      <div class="fgroup">
        <label>Mês</label>
        <select id="e-mes">
          <option value="jan">jan</option><option value="fev">fev</option>
          <option value="mar">mar</option><option value="abr" selected>abr</option>
          <option value="mai">mai</option><option value="jun">jun</option>
          <option value="jul">jul</option><option value="ago">ago</option>

        </select>
      </div>
      <div class="fgroup">
        <label>Data</label>
        <input type="text" id="e-data" placeholder="DD/MM/AAAA">
      </div>
      <div class="fgroup">
        <label>Projeto</label>

          <option value="Júlia/PRØ">Júlia / PRØ</option>
          <option value="Hubla">Hubla</option>
          <option value="Consultoria">Consultoria</option>
          <option value="Outros">Outros</option>
        </select>
      </div>
      <div class="fgroup">
        <label>Status</label>
        <select id="e-status">
          <option value="Recebido">Recebido</option>
          <option value="Pendente">Pendente</option>
        </select>
      </div>
    </div>
    <div class="form-grid-3">
      <div class="fgroup" style="grid-column:span 2">
        <label>Descrição</label>
        <input type="text" id="e-desc" placeholder="Ex: PRØ — Fixo + Comissão abril">
      </div>
      <div class="fgroup">
        <label>Valor MOR&CO (R$)</label>
        <input type="number" id="e-val" placeholder="0.00" step="0.01">
      </div>
    </div>
    <div class="fgroup" style="margin-bottom:14px">
      <label>Observação (opcional)</label>

      </select>
    </div>

</div>

      <div class="fgroup">

        <option value="">Todos</option>
        <option value="jan">jan</option><option value="fev">fev</option>
        <option value="mar">mar</option><option value="abr">abr</option>
        <option value="mai">mai</option>
      </select>
      <select onchange="renderListaCustos()" id="filtro-c-cat" style="background:var(--s2);border:1px solid var(--bd);color:var(--text);padding:4px 8px;font-size:10px;outline:none;">
        <option value="">Todas categorias</option>
        <option value="Colaboradores">Colaboradores</option>
        <option value="Tráfego pago">Tráfego pago</option>
        <option value="Ferramentas / SaaS">Ferramentas / SaaS</option>
        <option value="Imposto Notas Fiscais">Imposto Notas Fiscais</option>
        <option value="Outros / Não recorrentes">Outros</option>
      </select>
    </div>
  </div>
  <div id="lista-custos"></div>
</div>

// ─── INIT ───────────────────────────────────────────────────────────────────
function init() {
  carregar();
  // Se não há dados, carrega histórico
  if (ENTRADAS.length === 0) ENTRADAS = ENTRADAS_HISTORICO.map(e => ({...e}));
  if (CUSTOS.length === 0)   CUSTOS   = CUSTOS_HISTORICO.map(c => ({...c}));
  renderDashboard();
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const fmt = v => v == null ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = v => (Number(v)*100).toFixed(1) + '%';
const getMes = () => document.getElementById('mes-sel').value;
const nextId = arr => arr.length ? Math.max(...arr.map(x=>x.id))+1 : 1;

function sumE(mes, proj, status) {
  return ENTRADAS.filter(r =>
    r.mes === mes &&
    (!proj || r.proj === proj) &&
    (!status || r.status === status)
  ).reduce((s,r) => s + (Number(r.val)||0), 0);
}

function sumC(mes, cat, status) {
  return CUSTOS.filter(r =>
    r.mes === mes &&
    (!cat || r.cat === cat) &&
    (!status || r.status === status)
  ).reduce((s,r) => s + (Number(r.val)||0), 0);
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'entradas') renderListaEntradas();
  if (name === 'custos')   renderListaCustos();
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function renderDashboard() {
  const mes = getMes();
  renderKPIs(mes);
  renderEntradasDash(mes);
  renderCustosDash(mes);
  renderResultadoDash(mes);
  renderVenc();
  renderPend(mes);
}

function renderKPIs(mes) {
  const rec  = sumE(mes, null, 'Recebido');
  const prev = sumE(mes, null, null);
  const cus  = sumC(mes, null, 'Pago');
  const marg = rec - cus;
  document.getElementById('kpis').innerHTML = `
    <div class="card cg">
      <div class="clabel">Receita Confirmada</div>
      <div class="cval vp">${fmt(rec)}</div>
      <div class="csub">Previsto: ${fmt(prev)} · Pendente: ${fmt(prev-rec)}</div>
    </div>
    <div class="card ca">
      <div class="clabel">Custos Pagos</div>
      <div class="cval vn">${fmt(cus)}</div>
      <div class="csub">Previsto: ${fmt(sumC(mes,null,null))}</div>
    </div>
    <div class="card ${marg>=0?'cg':'ca'}">
      <div class="clabel">Margem Operacional</div>
      <div class="cval ${marg>=0?'vp':'vn'}">${fmt(marg)}</div>
      <div class="csub">${rec>0?fmtPct(marg/rec)+' sobre receita confirmada':'—'}</div>
    </div>`;
}

function renderEntradasDash(mes) {
  const projs = [
    {label:'Grupo PRØ — Júlia', key:'Júlia/PRØ'},
    {label:'Hubla',              key:'Hubla'},
    {label:'Consultoria',       key:'Consultoria'},
    {label:'Outros',            key:'Outros'},
  ];
  const rows = projs.map(p => {
    const prev = sumE(mes, p.key, null);
    const rec  = sumE(mes, p.key, 'Recebido');
    if (prev === 0 && rec === 0) return '';
    return `<tr><td>${p.label}</td><td>${fmt(prev)}</td><td class="vp">${fmt(rec)}</td><td class="${prev-rec>0?'va':''}">${fmt(prev-rec)}</td></tr>`;
  }).join('');
  const tp = sumE(mes,null,null), tr = sumE(mes,null,'Recebido');
  document.getElementById('entradas-dash').innerHTML = `
    <div class="ctitle">Entradas do Mês</div>
    <table><thead><tr><th>Projeto</th><th>Previsto</th><th>Recebido</th><th>Pendente</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="4" class="empty">Sem lançamentos</td></tr>'}</tbody></table>
    <div class="ft"><span>Total</span><span class="vp">${fmt(tr)} <span style="font-size:11px;color:var(--muted)">/ ${fmt(tp)}</span></span></div>`;
}

  const rows = cats.map(cat => {
    const prev = sumC(mes,cat,null);
    const pago = sumC(mes,cat,'Pago');
    if (prev === 0) return '';
    return `<tr><td>${cat}</td><td>${fmt(prev)}</td><td class="vn">${fmt(pago)}</td></tr>`;
  }).join('');
  const tp = sumC(mes,null,null), tpago = sumC(mes,null,'Pago');
  document.getElementById('custos-dash').innerHTML = `

  const pe   = sumE(mes,null,null) - rec;
  const pc   = sumC(mes,null,null) - cus;
  const prog = sumE(mes,null,null) > 0 ? Math.min(100, Math.round(rec/sumE(mes,null,null)*100)) : 0;
  document.getElementById('resultado-dash').innerHTML = `

// ─── API DO PAINEL ───────────────────────────────────────────────────────────
// Todo acesso a dados passa pela Edge Function `painel-api`. Não há chave do
// Supabase nem senha neste arquivo — o browser só carrega um token de sessão
// emitido pelo servidor no login.
const API_URL   = 'https://mxkewplpvtiqkmulhkfs.supabase.co/functions/v1/painel-api';
const TOKEN_KEY = 'morco_painel_token';

function getToken()      { return sessionStorage.getItem(TOKEN_KEY); }
function setToken(t)     { sessionStorage.setItem(TOKEN_KEY, t); }
function limparSessao()  { sessionStorage.removeItem(TOKEN_KEY); }

async function api(acao, extra = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(getToken() ? { 'x-painel-token': getToken() } : {})
    },
    body: JSON.stringify({ acao, ...extra })
  });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && acao !== 'login') {
    limparSessao();
    document.getElementById('login-screen').style.display = 'flex';
    throw new Error('sessão expirada');
  }
  if (!res.ok) throw new Error(body.erro || `erro ${res.status}`);
  return body;
}

// `listar` traz as duas tabelas de uma vez. O cache curto existe para que o
// Promise.all([sbGetAll('entradas'), sbGetAll('custos')]) do init vire uma
// requisição só, em vez de duas.
let _listaPendente = null;
function listar() {
  if (!_listaPendente) {
    _listaPendente = api('listar').finally(() => {
      setTimeout(() => { _listaPendente = null; }, 0);
    });
  }
  return _listaPendente;
}

async function sbGetAll(tabela) {
  const dados = await listar();
  return dados[tabela] || [];
}

async function sbInsert(tabela, linha) {
  const r = await api('inserir', { tabela, linha });
  return [r.linha];
}

async function sbUpdate(tabela, id, linha) {
  const r = await api('atualizar', { tabela, id, linha });
  return [r.linha];
}

async function sbDelete(tabela, id) {
  return api('excluir', { tabela, id });
}

// Converter row do Supabase para formato interno
function rowToEntrada(r) {
  return { id: r.id, mes: r.mes, data: r.data||'', desc: r.descricao, proj: r.proj, val: Number(r.val), status: r.status, obs: r.obs||'' };
}
function rowToCusto(r) {
  return { id: r.id, mes: r.mes, data: r.data||'', desc: r.descricao, cat: r.cat, val: Number(r.val), status: r.status, obs: r.obs||'' };
}
function entradaToRow(e) {
  return { mes: e.mes, data: e.data||null, descricao: e.desc, proj: e.proj, val: e.val, status: e.status, obs: e.obs||'' };
}
function custoToRow(c) {
  return { mes: c.mes, data: c.data||null, descricao: c.desc, cat: c.cat, val: c.val, status: c.status, obs: c.obs||'' };
}

// ─── OVERRIDE INIT para usar Supabase ────────────────────────────────────────
async function initSupabase() {
  // Mostrar loading
  document.querySelectorAll('.page').forEach(p => p.style.opacity = '0.5');
  
  try {
    // Carregar dados do Supabase
    const [eRows, cRows] = await Promise.all([
      sbGetAll('entradas'),
      sbGetAll('custos')
    ]);
    
    if (eRows.length === 0 && ENTRADAS_HISTORICO.length > 0) {
      // Primeiro acesso — popular com histórico
      showToast('Populando dados históricos...', 'amber');
      for (const e of ENTRADAS_HISTORICO) {
        await sbInsert('entradas', entradaToRow(e));
      }
      for (const c of CUSTOS_HISTORICO) {
        await sbInsert('custos', custoToRow(c));
      }
      // Recarregar
      const [e2, c2] = await Promise.all([sbGetAll('entradas'), sbGetAll('custos')]);
      ENTRADAS = e2.map(rowToEntrada);
      CUSTOS   = c2.map(rowToCusto);
    } else {
      ENTRADAS = eRows.map(rowToEntrada);
      CUSTOS   = cRows.map(rowToCusto);
    }
    
    document.querySelectorAll('.page').forEach(p => p.style.opacity = '1');
    showToast('✓ Conectado ao Supabase', 'green');
    renderDashboard();
    
  } catch(err) {
    document.querySelectorAll('.page').forEach(p => p.style.opacity = '1');
    console.error('Supabase error:', err);
    // Fallback para localStorage
    carregar();
    if (ENTRADAS.length === 0) ENTRADAS = ENTRADAS_HISTORICO.map(e => ({...e}));
    if (CUSTOS.length === 0)   CUSTOS   = CUSTOS_HISTORICO.map(c => ({...c}));
    showToast('⚠ Offline — usando dados locais', 'amber');
    renderDashboard();
  }
}

function showToast(msg, color) {
  const ind = document.getElementById('save-ind');
  ind.textContent = msg;
  ind.style.color = color === 'green' ? 'var(--green)' : color === 'amber' ? 'var(--amber)' : 'var(--accent)';
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 3000);
}

document.addEventListener('DOMContentLoaded', () => {});


// ─── AUTH ────────────────────────────────────────────────────────────────────
// A senha não existe mais no client: o login é validado pela Edge Function,
// que devolve um token de sessão assinado e com validade.

function checkAuth() {
  return !!getToken();
}

async function doLogin() {
  const btn  = document.getElementById('login-btn');
  const erro = document.getElementById('login-error');
  const p    = document.getElementById('login-pass').value;
  erro.textContent = '';
  if (btn) { btn.disabled = true; btn.textContent = 'Entrando...'; }

  try {
    const { token } = await api('login', { senha: p });
    setToken(token);
    document.getElementById('login-pass').value = '';
    document.getElementById('login-screen').style.display = 'none';
    initSupabase();
  } catch (e) {
    erro.textContent = e.message === 'senha incorreta'
      ? 'Senha incorreta.'
      : (e.message || 'Não foi possível entrar.');
    document.getElementById('login-pass').value = '';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
  }
}

function logout() {
  limparSessao();
  location.reload();
}

function guardInit() {
  if (checkAuth()) {
    document.getElementById('login-screen').style.display = 'none';
    initSupabase();
  }
  // Se não autenticado, login-screen permanece visível
}


guardInit();
</script>

<script id="list-collapse-script">
(function(){
  var MO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var currentMonth = MO[new Date().getMonth()];
  var collapsedState = {};

  function parseBRL(txt){
    if (!txt) return 0;
    var t = String(txt).replace(/[^\d,\-]/g,'').replace(',','.');
    var n = parseFloat(t);
    return isNaN(n) ? 0 : n;
  }

  function fmtBRL(v){
    return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
  }

  function groupTableByMonth(containerId){
    var container = document.getElementById(containerId);
    if (!container) return;
    var table = container.querySelector('table');
    if (!table) return;
    var thead = table.querySelector('thead');
    var tbody = table.querySelector('tbody');
    if (!thead || !tbody) return;

    var rows = Array.from(tbody.querySelectorAll('tr'));
    if (rows.length === 0) return;

    var groups = {};
    rows.forEach(function(tr){
      var firstCell = tr.querySelector('td');
      var mes = firstCell ? firstCell.textContent.trim() : '?';
      if (!groups[mes]) groups[mes] = [];
      groups[mes].push(tr);
    });

    var colCount = thead.querySelectorAll('th').length;

    tbody.innerHTML = '';
    MO.forEach(function(m){
      if (!groups[m] || groups[m].length === 0) return;
      var stateKey = containerId + '_' + m;
      if (!(stateKey in collapsedState)){
        collapsedState[stateKey] = (m !== currentMonth);
      }
      var isCollapsed = collapsedState[stateKey];

      var total = 0;
      groups[m].forEach(function(tr){
        var vpCell = tr.querySelector('.vp, .vn');
        if (vpCell) total += parseBRL(vpCell.textContent);
      });

      var headerRow = document.createElement('tr');
      headerRow.className = 'mes-header';
      var arrow = isCollapsed ? '▶' : '▼';
      var qty = groups[m].length;
      var td = document.createElement('td');
      td.colSpan = colCount;
      td.innerHTML = '<span class="mh-arrow">' + arrow + '</span>' + m.toUpperCase() + '<span class="mh-qty">' + qty + ' lancamentos</span><span class="mh-total">' + fmtBRL(total) + '</span>';
      td.setAttribute('data-mes', m);
      td.setAttribute('data-container', containerId);
      td.onclick = function(){
        var key = containerId + '_' + m;
        collapsedState[key] = !collapsedState[key];
        var trs = tbody.querySelectorAll('tr[data-mes-row="' + m + '"]');
        trs.forEach(function(t){ t.style.display = collapsedState[key] ? 'none' : ''; });
        this.querySelector('.mh-arrow').textContent = collapsedState[key] ? '▶' : '▼';
      };
      headerRow.appendChild(td);
      tbody.appendChild(headerRow);

      groups[m].forEach(function(tr){
        tr.setAttribute('data-mes-row', m);
        if (isCollapsed) tr.style.display = 'none';
        tbody.appendChild(tr);
      });
    });
  }

  function wrapRender(fnName, containerId){
    var orig = window[fnName];
    if (typeof orig !== 'function') return false;
    if (orig.__wrapped) return true;
    var wrapped = function(){
      var r = orig.apply(this, arguments);
      try { groupTableByMonth(containerId); } catch(e){ console.error('group', e); }
      return r;
    };
    wrapped.__wrapped = true;
    window[fnName] = wrapped;
    return true;
  }

  function init(){
    var okE = wrapRender('renderListaEntradas', 'lista-entradas');
    var okC = wrapRender('renderListaCustos', 'lista-custos');
    if (!okE || !okC){
      setTimeout(init, 400);
      return;
    }
    if (document.getElementById('lista-entradas') && document.getElementById('lista-entradas').querySelector('table')){
      groupTableByMonth('lista-entradas');
    }
    if (document.getElementById('lista-custos') && document.getElementById('lista-custos').querySelector('table')){
      groupTableByMonth('lista-custos');
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

<script id="dash-annual-chart">
(function(){
  var MO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var chartInstance = null;

  function loadScript(src, id, cb){
    if (document.getElementById(id)){
      var check = setInterval(function(){
        if (window.Chart && (id !== '__chartjs_dl_cdn__' || window.ChartDataLabels)){
          clearInterval(check); cb();
        }
      }, 100);
      return;
    }
    var s = document.createElement('script');
    s.id = id;
    s.src = src;
    s.onload = cb;
    document.head.appendChild(s);
  }

  function ensureChartJs(cb){
    if (window.Chart && window.ChartDataLabels){
      try { window.Chart.register(window.ChartDataLabels); } catch(e){}
      cb();
      return;
    }
    var loadDL = function(){
      if (window.ChartDataLabels){
        try { window.Chart.register(window.ChartDataLabels); } catch(e){}
        cb();
        return;
      }
      loadScript('https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js', '__chartjs_dl_cdn__', function(){
        try { window.Chart.register(window.ChartDataLabels); } catch(e){}
        cb();
      });
    };
    if (window.Chart){ loadDL(); return; }
    loadScript('https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js', '__chartjs_cdn__', loadDL);
  }

  function injectContainer(){
    var existing = document.getElementById('dash-annual-chart-wrap');
    if (existing) return true;
    var dashPage = document.getElementById('page-dashboard');
    if (!dashPage) return false;
    var wrap = document.createElement('div');
    wrap.id = 'dash-annual-chart-wrap';
    wrap.className = 'card';
    wrap.innerHTML = ''
      + '<div class="ctitle">Faturamento vs Custo — Ano Corrente</div>'
      + '<div class="chart-box"><canvas id="dash-annual-canvas"></canvas></div>'
      + '<div class="chart-summary">'
      +   '<div class="cs-item"><div class="cs-label">Margem Acumulada</div><div class="cs-value" id="dash-margin-total">—</div></div>'
      +   '<div class="cs-item"><div class="cs-label">Margem Média Mensal</div><div class="cs-value" id="dash-margin-avg">—</div></div>'
      + '</div>';
    dashPage.appendChild(wrap);
    return true;
  }

  function fmtBRL(v){
    return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtCompact(v){
    var n = Number(v);
    var abs = Math.abs(n);
    var sign = n < 0 ? '-' : '';
    if (abs >= 1000) return sign + 'R$ ' + (abs/1000).toFixed(abs >= 10000 ? 0 : 1).replace('.', ',') + 'k';
    return sign + 'R$ ' + abs.toFixed(0);
  }

  function renderChart(){
    if (!window.Chart) return;
    if (typeof ENTRADAS === 'undefined' || typeof CUSTOS === 'undefined') return;
    if (!injectContainer()) return;
    var canvas = document.getElementById('dash-annual-canvas');
    if (!canvas) return;

    var currentIdx = new Date().getMonth();
    var months = MO.slice(0, currentIdx + 1);

    function agg(list, statusMatch){
      var m = {};
      list.forEach(function(r){
        if (r.status !== statusMatch) return;
        m[r.mes] = (m[r.mes] || 0) + Number(r.val || 0);
      });
      return months.map(function(k){ return m[k] || 0; });
    }

    var receitas = agg(ENTRADAS, 'Recebido');
    var custos = agg(CUSTOS, 'Pago');
    var margem = receitas.map(function(r, i){ return r - custos[i]; });

    var margemTotal = margem.reduce(function(a, b){ return a + b; }, 0);
    var margemAvg = months.length > 0 ? margemTotal / months.length : 0;

    var totEl = document.getElementById('dash-margin-total');
    var avgEl = document.getElementById('dash-margin-avg');
    if (totEl){
      totEl.textContent = fmtBRL(margemTotal);
      totEl.className = 'cs-value ' + (margemTotal >= 0 ? 'pos' : 'neg');
    }
    if (avgEl){
      avgEl.textContent = fmtBRL(margemAvg);
      avgEl.className = 'cs-value ' + (margemAvg >= 0 ? 'pos' : 'neg');
    }

    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: months.map(function(m){ return m.charAt(0).toUpperCase() + m.slice(1); }),
        datasets: [
          {
            label: 'Receita Recebida',
            data: receitas,
            backgroundColor: 'rgba(15,123,108,0.85)',
            borderRadius: 4,
            order: 2,
            datalabels: {
              anchor: 'end', align: 'end', offset: 2,
              color: '#0f7b6c',
              font: { size: 10, weight: '600' },
              formatter: function(v){ return v > 0 ? fmtCompact(v) : ''; }
            }
          },
          {
            label: 'Custo Pago',
            data: custos,
            backgroundColor: 'rgba(224,62,62,0.85)',
            borderRadius: 4,
            order: 2,
            datalabels: {
              anchor: 'end', align: 'end', offset: 2,
              color: '#e03e3e',
              font: { size: 10, weight: '600' },
              formatter: function(v){ return v > 0 ? fmtCompact(v) : ''; }
            }
          },
          {
            label: 'Lucro do Mês',
            data: margem,
            type: 'line',
            borderColor: '#2383e2',
            backgroundColor: '#2383e2',
            borderWidth: 2,
            pointRadius: 5,
            pointHoverRadius: 7,
            pointBackgroundColor: '#2383e2',
            tension: 0.3,
            order: 1,
            datalabels: {
              anchor: 'end', align: 'top', offset: 6,
              color: '#2383e2',
              backgroundColor: 'rgba(255,255,255,0.85)',
              borderRadius: 3,
              padding: { top: 2, bottom: 2, left: 4, right: 4 },
              font: { size: 10, weight: '700' },
              formatter: function(v){ return fmtCompact(v); }
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 24 } },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 12 } },
          tooltip: {
            callbacks: {
              label: function(ctx){
                return ctx.dataset.label + ': ' + fmtBRL(ctx.parsed.y);
              }
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            grid: { color: 'rgba(55,53,47,0.05)' },
            ticks: { callback: function(v){ return 'R$ ' + Math.round(v/1000) + 'k'; }, font: { size: 10 } }
          },
          x: {
            grid: { display: false },
            ticks: { font: { size: 11 } }
          }
        }
      }
    });
  }

  function tryRender(){
    ensureChartJs(function(){
      renderChart();
    });
  }

  var _origRender = window.renderDashboard;
  window.renderDashboard = function(){
    if (typeof _origRender === 'function') _origRender.apply(this, arguments);
    tryRender();
  };

  function init(){
    if (typeof ENTRADAS === 'undefined' || typeof CUSTOS === 'undefined' || !document.getElementById('page-dashboard')){
      setTimeout(init, 400);
      return;
    }
    tryRender();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
